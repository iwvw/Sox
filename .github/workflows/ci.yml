name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 与本地调试一致：UseWinUI + SelfContained 需要显式 Platform 与 RID。
      - name: Build
        shell: pwsh
        run: |
          dotnet build src/Sox.App/Sox.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64

      # Core 的纯逻辑单测（热键解析、历史分桶、快照布局校验）。没有测试就等于没有回归护栏。
      - name: Test
        shell: pwsh
        run: dotnet test tests/Sox.Core.Tests/Sox.Core.Tests.csproj -c Release --nologo
