name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0），留空则用 Directory.Build.props 里的值'
        required: false
        default: ''

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v) -and $env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          }
          # Directory.Build.props 里的 SoxVersion 带 Condition 属性，PowerShell 的 XML 适配器会把它
          # 读成 XmlElement（ToString 得到类型名），必须读 InnerText。
          [xml]$xml = Get-Content -LiteralPath Directory.Build.props
          $declared = $xml.Project.PropertyGroup.SoxVersion.InnerText
          if ([string]::IsNullOrWhiteSpace($v)) { $v = $declared }
          # tag 触发时，tag 必须与仓库声明的版本一致，避免发出对不上号的包。
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $v -ne $declared) {
            throw "tag v$v 与 Directory.Build.props 的 SoxVersion=$declared 不一致。"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $v"

      - name: Install Inno Setup
        if: matrix.arch == 'x64'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Fetch Simplified Chinese language file
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $dir = "build\languages"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $path = "Files/Languages/ChineseSimplified.isl"
          $urls = @(
            "https://raw.githubusercontent.com/jrsoftware/issrc/main/$path",
            "https://gh-proxy.org/https://raw.githubusercontent.com/jrsoftware/issrc/main/$path",
            "https://ghproxy.net/https://raw.githubusercontent.com/jrsoftware/issrc/main/$path"
          )
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile "$dir\ChineseSimplified.isl" -TimeoutSec 30
              Write-Host "Downloaded ChineseSimplified.isl from $u"
              break
            } catch {
              Write-Host "::warning::下载失败：$u"
            }
          }

      - name: Build release artifacts
        shell: pwsh
        run: |
          # 脚本自身对非 x64 跳过安装包（Inno 的 ArchitecturesAllowed=x64compatible）。
          pwsh -File build/build-release.ps1 `
            -Arch "${{ matrix.arch }}" `
            -Version "${{ steps.ver.outputs.version }}" `
            -Configuration $env:CONFIGURATION

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sox-${{ matrix.arch }}
          path: |
            artifacts/Sox-*.zip
            artifacts/Sox-*-setup.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem artifacts -Recurse | Select-Object Name, Length

      - name: Resolve version & previous tag
        id: meta
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $prev = git describe --tags --abbrev=0 "v$v^" 2>$null
          "previous=$prev" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$v previous=$prev"

      - name: Generate release notes
        shell: pwsh
        run: |
          pwsh -File .github/scripts/gen-release-notes.ps1 `
            -Version "${{ steps.meta.outputs.version }}" `
            -ArtifactsDir "${{ github.workspace }}/artifacts" `
            -OutputPath "${{ github.workspace }}/release-notes.md" `
            -PreviousTag "${{ steps.meta.outputs.previous }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
          draft: false
